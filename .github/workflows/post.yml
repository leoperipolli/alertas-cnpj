name: post diario

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília
  workflow_dispatch:        # botao de "rodar agora" na aba Actions

permissions:
  contents: write           # para commitar o estado da agenda

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar e publicar o corte do dia
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m bot.run

      # A agenda precisa lembrar qual corte ja saiu, senao o bot repete o mesmo
      # post todo dia. O commit e' o "banco de dados" — e e' o suficiente.
      - name: Guardar o corte gasto
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/agenda_estado.json
          git diff --staged --quiet || git commit -m "agenda: corte do dia"
          git push

  # Dead man's switch: se o job acima nao rodar ou falhar, isto avisa.
  # E' o alerta n. 6 do §8 do documento, e nasce de graca aqui.
  avisar_falha:
    needs: postar
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Avisar no Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="⚠️ O bot de CNPJ nao postou hoje. Rode: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
