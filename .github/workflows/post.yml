name: post diario

on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 em Brasília
  workflow_dispatch:        # botao de "rodar agora" na aba Actions

permissions:
  contents: write           # para commitar o estado da agenda

jobs:
  postar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Gerar e publicar o corte do dia
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
        run: python -m bot.run

      # A agenda precisa lembrar qual corte ja saiu, senao o bot repete o mesmo
      # post todo dia. O commit e' o "banco de dados" — e e' o suficiente.
      - name: Guardar o corte gasto
        run: |
          git config user.name  "bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/agenda_estado.json
          git diff --staged --quiet || git commit -m "agenda: corte do dia"
          git push

  # Dead man's switch: quando um workflow AGENDADO falha, o GitHub ja manda e-mail
  # automatico para o dono do repo (Settings > Notifications > Actions). Por isso nao
  # ha job de alerta aqui — o `run: python -m bot.run` sai com codigo != 0 em qualquer
  # erro (ver bot/run.py) e isso basta para disparar o e-mail nativo.
